<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景亮色渐变 (珍珠白 -> 柔和钛空灰) -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Flow 贯穿流线渐变 (翡翠绿 -> 电光极光蓝) -->
    <linearGradient id="flow-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- 亮色面板精致外描边 -->
    <linearGradient id="panel-stroke-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.04"/>
    </linearGradient>

    <!-- 柔和发光与立体阴影 -->
    <filter id="light-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    
    <filter id="line-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS 标准 Icon 圆角底座 (带有柔和投影) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad-light)" filter="url(#light-shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" stroke="url(#panel-stroke-light)" stroke-width="2"/>

  <!-- 背景细微网格线 -->
  <g opacity="0.25">
    <line x1="256" y1="112" x2="256" y2="400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>
    <line x1="112" y1="256" x2="400" y2="256" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 6"/>
  </g>

  <!-- 4 个分屏面板 (Panes) - 柔和半透明纯白卡片 -->
  <!-- Pane 1: 左上 -->
  <rect x="112" y="112" width="132" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.75" stroke="url(#panel-stroke-light)" stroke-width="1.5" filter="url(#light-shadow)"/>
  <!-- Pane 2: 右上 -->
  <rect x="268" y="112" width="132" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.75" stroke="url(#panel-stroke-light)" stroke-width="1.5" filter="url(#light-shadow)"/>
  <!-- Pane 3: 左下 -->
  <rect x="112" y="268" width="132" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.75" stroke="url(#panel-stroke-light)" stroke-width="1.5" filter="url(#light-shadow)"/>
  <!-- Pane 4: 右下 -->
  <rect x="268" y="268" width="132" height="132" rx="16" fill="#FFFFFF" fill-opacity="0.75" stroke="url(#panel-stroke-light)" stroke-width="1.5" filter="url(#light-shadow)"/>

  <!-- Flow 贯穿光束 (流光翡翠绿 -> 极光蓝) -->
  <path d="M 130 350 C 180 350, 180 160, 256 256 C 330 350, 330 160, 380 160" 
        stroke="url(#flow-grad-light)" 
        stroke-width="16" 
        stroke-linecap="round" 
        filter="url(#line-glow)"/>

  <!-- 光束两端的节点 -->
  <circle cx="130" cy="350" r="9" fill="#10B981"/>
  <circle cx="380" cy="160" r="9" fill="#3B82F6"/>
</svg>
