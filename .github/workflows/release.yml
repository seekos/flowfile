name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build macOS Universal
    runs-on: macos-latest
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-universal

      - name: Read version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install macOS system build dependencies
        shell: bash
        run: brew install cmake pkg-config

      - name: Run release quality gates
        shell: bash
        run: |
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT="$sdk_path"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_darwin="--target=arm64-apple-macos11 -isysroot $sdk_path"
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          for variable in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required release secret is missing: $variable" >&2
              exit 1
            fi
          done
          certificate_path="$RUNNER_TEMP/flowfile-certificate.p12"
          keychain_path="$RUNNER_TEMP/flowfile-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | openssl base64 -d -A > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | \
            sed -nE 's/.*"(Developer ID Application:[^"]+)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "Imported certificate does not include a Developer ID Application identity." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build arm64 and x86_64 release binaries
        shell: bash
        run: |
          sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT="$sdk_path"
          export MACOSX_DEPLOYMENT_TARGET=11.0
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_darwin="--target=arm64-apple-macos11 -isysroot $sdk_path"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_apple_darwin="--target=x86_64-apple-macos11 -isysroot $sdk_path"
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package signed macOS Universal DMG
        shell: bash
        run: |
          set -euo pipefail
          app_path="dist/FlowFile.app"
          contents_path="$app_path/Contents"
          mkdir -p "$contents_path/MacOS" "$contents_path/Resources"

          lipo -create \
            "target/aarch64-apple-darwin/release/flowfile" \
            "target/x86_64-apple-darwin/release/flowfile" \
            -output "$contents_path/MacOS/flowfile"
          chmod 755 "$contents_path/MacOS/flowfile"
          cp resources/Info.plist "$contents_path/Info.plist"
          cp resources/FlowFile.icns "$contents_path/Resources/FlowFile.icns"
          cp resources/PrivacyInfo.xcprivacy "$contents_path/Resources/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleShortVersionString $VERSION" "$contents_path/Info.plist"
          /usr/libexec/PlistBuddy -c \
            "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$contents_path/Info.plist"

          lipo -info "$contents_path/MacOS/flowfile"
          codesign --force --deep --options runtime \
            --sign "$CODESIGN_IDENTITY" "$app_path"
          codesign --verify --deep --strict "$app_path"

          dmg_stage="$(mktemp -d)"
          trap 'rm -rf "$dmg_stage"' EXIT
          cp -R "$app_path" "$dmg_stage/FlowFile.app"
          ln -s /Applications "$dmg_stage/Applications"
          hdiutil create \
            -volname FlowFile \
            -srcfolder "$dmg_stage" \
            -ov -format UDZO \
            "dist/FlowFile-$VERSION-macos-universal.dmg"
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" \
            "dist/FlowFile-$VERSION-macos-universal.dmg"

      - name: Notarize and staple DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="dist/FlowFile-$VERSION-macos-universal.dmg"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          codesign --verify --verbose=2 "$dmg_path"

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.dmg

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowfile-macos-universal
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@v4
        with:
          name: flowfile-macos-universal
          path: release-assets

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.dmg)
          if (( ${#assets[@]} == 0 )); then
            echo "No DMG release asset was downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "FlowFile $GITHUB_REF_NAME" \
              --generate-notes
          fi
